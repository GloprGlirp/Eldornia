# Render-Blueprint für den Eldornia-Server.
# Kostenlose Render-Konten haben nur EINE Gratis-Datenbank. Eldornia nutzt deshalb eine vorhandene
# PostgreSQL-Datenbank mit (eigenes Schema "eldornia", kollidiert nicht mit anderen Projekten):
# Beim Anlegen nach DATABASE_URL gefragt → "Internal Database URL" der bestehenden Datenbank einfügen.
services:
  - type: web
    name: eldornia
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python tools/fetch_web_build.py
    startCommand: cd server && uvicorn app.main:app --host 0.0.0.0 --port $PORT --ws-ping-interval 30 --ws-ping-timeout 180
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DB_SCHEMA
        value: eldornia
